name: Host-Ship 自动续期

on:
  workflow_dispatch:

  schedule:
    # 每天北京时间 08:00 自动检查
    # GitHub cron 使用 UTC
    # UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  renew:
    name: 自动续期检查
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip
          pip install playwright requests "requests[socks]"
          python -m playwright install --with-deps chromium

      - name: 配置代理节点（可选）
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            echo "检测到 NODE_LINK，正在配置本地代理..."

            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

          else
            echo "IS_PROXY=false" >> "$GITHUB_ENV"
            echo "未配置 NODE_LINK，将使用直连。"
          fi

      - name: 执行续期
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          HOSTSHIP_LOGIN: ${{ secrets.HOSTSHIP_LOGIN }}
          HOSTSHIP_PASSWORD: ${{ secrets.HOSTSHIP_PASSWORD }}
          HOSTSHIP_COOKIE: ${{ secrets.HOSTSHIP_COOKIE }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}

          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}

        run: xvfb-run -a python hostship_renew.py

      - name: 失败时上传调试截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hostship-debug-screenshots
          path: |
            hostship_*.png
          if-no-files-found: ignore

      - name: 清理代理
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log || true
